name: sillytavern_app
description: "SillyTavern APP：LLM 前端，面向角色扮演与 AI 互动。"
publish_to: 'none'
version: 2.1.0+9

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  flutter_secure_storage: ^10.3.4
  uuid: ^4.5.1
  intl: ^0.20.2
  share_plus: ^12.0.2
  sqflite: ^2.4.2
  path: ^1.9.1
  forui: ^0.16.0
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  idb_shim: ^2.6.7+1
  record: 6.2.1
  audioplayers: 6.7.1
  url_launcher: ^6.3.2

dev_dependencies:
  image_picker_platform_interface: ^2.11.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app_icon_1024.png
