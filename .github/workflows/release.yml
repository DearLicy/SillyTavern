name: GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, for example v2.0.0
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.35.1
  TMPDIR: ${{ github.workspace }}/.tmp
  TMP: ${{ github.workspace }}/.tmp
  TEMP: ${{ github.workspace }}/.tmp

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: mkdir -p .tmp && flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: mkdir -p .tmp && flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p .tmp/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app .tmp/ipa/Payload/
          cd .tmp/ipa
          zip -qry ../../build/SillyTavern-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/SillyTavern-unsigned.ipa

  publish:
    runs-on: ubuntu-latest
    needs: [android, ios]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - run: |
          mkdir -p release-assets/flat
          find release-assets -mindepth 2 -type f -exec cp -t release-assets/flat {} +
          cd release-assets/flat
          sha256sum *.apk *.ipa > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: SillyTavern ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-assets/flat/*.apk
            release-assets/flat/*.ipa
            release-assets/flat/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            SillyTavern V2 GitHub build.

            - Android APK can be installed directly.
            - iOS IPA is unsigned. Use iLoader + LiveContainer + SideStore or your own Xcode certificate.
            - API keys and local data are never included in release assets.
