name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.35.1
  TMPDIR: ${{ github.workspace }}/.tmp
  TMP: ${{ github.workspace }}/.tmp
  TEMP: ${{ github.workspace }}/.tmp

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: mkdir -p .tmp && flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: mkdir -p .tmp && flutter pub get
      - run: flutter build web --release --base-href "/Dreamtide/"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser QA dependencies
        env:
          npm_config_cache: ${{ github.workspace }}/.tmp/npm-cache
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/pw-browsers
        run: |
          mkdir -p .tmp/qa
          cp tool/qa/package*.json .tmp/qa/
          npm ci --prefix .tmp/qa --ignore-scripts --no-audit --no-fund
          node .tmp/qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify provider, avatar and multimodal workflows
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/pw-browsers
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.tmp/qa/node_modules/playwright
        run: |
          dart run tool/qa/export_fixture.dart
          bash tool/qa/run-browser-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .tmp/*-light.png
            .tmp/*-dark.png
            .tmp/*-report.json
            .tmp/browser-*.log

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: mkdir -p .tmp && flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: mkdir -p .tmp && flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p .tmp/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app .tmp/ipa/Payload/
          cd .tmp/ipa
          zip -qry ../../build/Dreamtide-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/Dreamtide-unsigned.ipa
